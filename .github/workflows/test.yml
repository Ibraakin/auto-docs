name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  unit-tests:
    name: Unit-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run unit tests
        run: npm test

  smoke-test:
    name: Smoke-Test (echte API)
    runs-on: ubuntu-latest
    # Nur auf main-Push, damit PRs von Externen nicht das Budget belasten
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run smoke test
        env:
          ADESSO_AI_HUB_KEY: ${{ secrets.ADESSO_AI_HUB_KEY }}
        run: npm run test:smoke
